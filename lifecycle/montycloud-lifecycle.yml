documentation:
  public_reference:
    published: false
    detail: >-
      There is no public API reference. MontyCloud operates developer.montycloud.com as a PRIVATE
      GitHub Pages site: an anonymous GET returns HTTP 302 to
      https://github.com/pages/auth?...&page_id=56842083, i.e. it requires membership of the
      MontyCloud GitHub organization. The marketing site's page sitemap contains no docs,
      developer or API page at all. No DeveloperPortal or APIReference pointer is emitted for this
      repo, because crediting a portal no member of the public can open would be false credit.
    probed:
