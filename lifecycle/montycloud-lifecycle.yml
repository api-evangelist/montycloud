      status: 200
      detail: >-
        ~100 public Freshdesk articles covering onboarding, tenants, users, SSO, WAFR, bots,
        patching, reporting and AWS Billing Conductor. Product documentation, not API reference —
        a search for "API key" returns no credential or endpoint article.
    - name: MontyCloud DAY2 Python SDK on PyPI
      url: https://pypi.org/project/day2/
      status: 200
      detail: >-
        The de-facto public API reference. Docstrings on every SDK method carry the description,
        arguments, return type, raised errors and a worked example, which is why this repo's
        authentication, conventions, errors and data-model artifacts are derived from it.
