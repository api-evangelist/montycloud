summary: >-
  MontyCloud publishes almost nothing about the operational lifecycle of the DAY2 API. There is no
  public changelog or release-notes page, no status page, no deprecation policy, no sunset-header
  contract and no published SLA. What can be established is the API versioning scheme (from the
  SDK) and the release cadence of the SDK itself.
versioning:
  scheme: path segment
  current: v1
  supported: [v1, v2]
  base: https://api.montycloud.com/day2/api/{version}
  source: pypi:day2@0.5.0 (day2/client/config.py — api_version validated against ["v1","v2"])
  note: >-
    v2 is selectable per call in the SDK but MontyCloud documents nothing about what it contains,
    when v1 sunsets, or how the two differ.
status_page:
  published: false
  probed:
    - url: https://status.montycloud.com/
      result: DNS does not resolve
      checked: '2026-08-26'
  note: >-
    No status.montycloud.com, no status link in the site footer or sitemap, and no status article
    in the support knowledge base. No StatusPage pointer is emitted.
deprecation_policy:
  published: false
  sunset_header: unknown
  deprecation_header: unknown
  rfc8594: unknown
  observed_signal:
    - artifact: pypi:day2@0.5.0
      file: day2_cli/commands/tenant_docs_cli.py
      text: >-
        "Wrapper around tenant commands for backward compatibility in docs. (shall be removed later
        after deprecation period)"
      note: >-
        The only deprecation language MontyCloud publishes anywhere. It concerns a CLI wrapper, not
        an API operation, and names no date or policy. No Deprecation pointer is emitted.
sla:
  published: false
  note: >-
    No public SLA. The Trust Center publishes disaster-recovery objectives instead — RPO 24 hours,
    RTO 6 hours, with regular DR testing — which are recovery targets, not an availability
    commitment.
  source: https://montycloud.com/trust-center/
