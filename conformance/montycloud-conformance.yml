      Trust Service Criteria over an extended observation period. Report available under mutual NDA.
    source: https://montycloud.com/trust-center/
  - id: gdpr
    conforms: true
    evidence: >-
      "MontyCloud is GDPR compliant, aligned with the requirements set forth by the General Data
      Protection Regulation (EU) 2016/679." Data subject rights supported for EU, EEA and UK.
    source: https://montycloud.com/trust-center/
  - id: us-state-privacy
    conforms: true
    evidence: >-
      Trust Center states support for data subject rights under the UK Data Protection Act 2018 and
      US state privacy laws including California, Colorado, Connecticut, Texas and Virginia.
    source: https://montycloud.com/trust-center/
  - id: pci-dss
    conforms: false
    evidence: >-
      Explicitly out of scope — "the MontyCloud platform does not collect payment information and
      is PCI DSS out-of-scope". The underlying AWS data centers hold PCI DSS Level 1, which is
      inherited infrastructure compliance, not MontyCloud's own.
    source: https://montycloud.com/trust-center/
  - id: iso-27001
    conforms: inherited
    evidence: >-
      Claimed for the AWS data centers the platform runs in, not for MontyCloud as an organization.
