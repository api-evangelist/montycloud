domain_standards:
  - id: model-context-protocol
    version: '2025-06-18'
    conforms: claimed
    evidence: >-
      "The MCP server is designed for compliance with the MCP specifications (MCP Spec
      2025-06-18)", using the streamable HTTP transport. The contract itself could not be read —
      an anonymous tools/list POST to https://api.montycloud.com/mcp returns HTTP 401 — so this is
      MontyCloud's stated conformance, corroborated by a live JSON-RPC-shaped 401, not a verified
      handshake.
    source: https://montycloud.com/mcp-server-security-statement/
    spec_location: https://api.montycloud.com/mcp
  - id: aws-well-architected-framework
    conforms: true
    evidence: >-
      The DAY2 API exposes the AWS Well-Architected Framework as a first-class contract surface,
      not as marketing language: /tenants/{tenant_id}/assessments carries lens selection ("AWS
      Well-Architected Framework"), the six-pillar question set
      (/assessments/{id}/questions/{question_id} keyed on pillars such as operational-excellence),
      answer submission, findings, milestones-style scheduling and report generation. MontyCloud is
      an AWS Well-Architected Partner Program member with the AWS Cloud Operations Software
      Competency and AWS Built-in Competency, and advertises 500+ Well-Architected checks. A
      consumer who already speaks WAFR integrates without a bespoke connector.
    source: pypi:day2@0.5.0 (day2/resources/assessment.py) + https://montycloud.com/trust-center/
    also: https://montycloud.com/technology-partners/aws/wafr/
  - id: aws-well-architected-framework-azure-lens
    conforms: true
    evidence: >-
      A parallel Azure WAFR surface exists at /tenants/{tenant_id}/azure/azure-wafr/assessments,
      extending the same assessment model to Azure.
    source: pypi:day2@0.5.0 (day2/resources/azure_assessment.py)
  - id: aws-migration-acceleration-program
    conforms: true
    evidence: >-
      MAP project tracking is modelled directly in the API: /tenants/{tenant_id}/map-projects with
      per-project resources and services, matching AWS MAP reporting requirements.
    source: pypi:day2@0.5.0 (day2/resources/map_project.py)
  - id: aws-billing-conductor
    conforms: true
    evidence: >-
      DAY2 integrates with AWS Billing Conductor for MSP billing; a 19-article support section
      documents the integration, and the API exposes cost by charge type.
    source: https://support.montycloud.com/support/solutions
