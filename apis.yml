- aid: montycloud-cloudops-mcp-server
  name: MontyCloud CloudOps MCP Server
  description: >-
    MontyCloud's hosted, remote Model Context Protocol server for the DAY2 platform. MontyCloud's
    own MCP Server Security Statement places it at the api.montycloud.com endpoint, states it is
    cloud-hosted rather than a local stdio binary, targets MCP spec 2025-06-18, uses the streamable
    HTTP transport over TLS, and authenticates with an API key and secret key brokered by AWS API
    Gateway and Amazon Cognito. An anonymous JSON-RPC tools/list POST to
    https://api.montycloud.com/mcp returns HTTP 401, confirming the endpoint exists and is
    auth-gated; the live tool schemas therefore require authenticated introspection.
  humanURL: https://montycloud.com/platform/montycloud-ai/
  baseURL: https://api.montycloud.com/mcp
  tags:
  - Model Context Protocol
  - Agents
