aid: montycloud
name: MontyCloud
description: >-
  MontyCloud is a Bellevue, Washington software company whose DAY2 platform is a no-code,
  autonomous CloudOps product for AWS-focused managed service providers and enterprise cloud
  teams. DAY2 connects to customer AWS (and Azure) accounts through a scoped cross-account IAM
  role and delivers multi-tenant inventory and discovery, AWS Well-Architected Framework Reviews,
  compliance and security bots, patching and server management, cost and AWS Billing Conductor
  reporting, MAP project tracking, blueprints and governance automation. The platform is
  programmable: MontyCloud publishes a first-party Python SDK and CLI (`day2` on PyPI) against a
  tenant-scoped REST API at api.montycloud.com, and ships a hosted CloudOps MCP Server so AI
  agents can drive cloud operations directly. MontyCloud is an AWS Cloud Operations Software
  Competency and AWS Built-in partner, is SOC 2 Type II audited and GDPR aligned, and also
  open-sources Moya, a multi-agent orchestration framework.
