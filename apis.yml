apis:
- aid: montycloud-day2-api
  name: MontyCloud DAY2 API
  description: >-
    The tenant-scoped REST API behind the MontyCloud DAY2 platform. Requests are authenticated with
    an API key and API secret key issued in the DAY2 platform and are scoped to a tenant via the
    x-tenant-id header. The surface covers tenants, users, roles, cloud account onboarding and
    region connection, resource inventory, AWS Well-Architected assessments and schedules, Azure
    WAFR assessments, compliance bot findings, cost by charge type, MAP projects, projects and
    reports. MontyCloud publishes no public OpenAPI; the reference lives at
    developer.montycloud.com, which is a private GitHub Pages site that 302s to a GitHub
    organization login. The operation surface recorded in this repo is derived from MontyCloud's
    own published `day2` Python SDK on PyPI.
  humanURL: https://montycloud.com/platform/day2-platform/
  baseURL: https://api.montycloud.com/day2/api/v1
